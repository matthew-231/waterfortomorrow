<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WaterForTomorrow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Modern Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
    }

    /* NAVBAR */
    .navbar {
      position: absolute;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      box-sizing: border-box;
      z-index: 2;
    }

    .logo {
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .nav-links a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 400;
      opacity: 0.9;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                  url(images/watercrisishome.jpg);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 20px;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero-content h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 15px;
      letter-spacing: -1px;
    }

    .hero-content p {
      font-size: 1.2rem;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #e5e7eb;
    }

    /* BUTTONS */
    .btn {
      padding: 12px 28px;
      margin: 5px;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: #22c55e;
      color: white;
      box-shadow: 0 8px 20px rgba(34,197,94,0.3);
    }

    .btn-primary:hover {
      background-color: #16a34a;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1.5px solid white;
      color: white;
    }

    .btn-secondary:hover {
      background-color: white;
      color: black;
      transform: translateY(-2px);
    }

    /* INFO SECTION */
    .info {
      padding: 80px 20px;
      text-align: center;
      max-width: 900px;
      margin: auto;
    }

    .info h2 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .info p {
      color: #555;
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .hero-content h1 {
        font-size: 2.2rem;
      }

      .hero-content p {
        font-size: 1rem;
      }

      .navbar {
        padding: 15px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">WaterForTomorrow</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="watercrisis.html">Water Crisis</a>
      <a href="takeaction.html">Take Action</a>
      <a href="about.html">About</a>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Clean water today.<br>A better world tomorrow.</h1>
      <p>Raising awareness about the global water crisis and how you can help.</p>
      <a href="watercrisis.html">
        <button class="btn btn-primary">Learn More</button>
      </a>
      <a href="takeaction.html">
        <button class="btn btn-secondary">Take Action</button>
      </a>
  </section>

</body>
</html>
